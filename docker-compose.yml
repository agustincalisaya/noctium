version: '3.8'

services:
  db:
    image: postgres:16
    container_name: noctium_db
    restart: always
    environment:
      POSTGRES_USER: noctium
      POSTGRES_PASSWORD: noctium
      POSTGRES_DB: noctium_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: